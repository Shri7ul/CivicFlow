name: verify

# Phase 13: continuous verification only. This workflow never deploys and
# never touches a production database or a live Supabase project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest
      - name: Verify single Alembic head
        working-directory: backend
        run: |
          python -m alembic heads
          test "$(python -m alembic heads | wc -l)" -eq "1"

  frontend:
    name: Frontend typecheck, lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Tracked environment file detected" >&2
            exit 1
          fi
      - name: Reject obvious private keys
        run: |
          if git ls-files | grep -E '\.(pem|key|p12|pfx)$'; then
            echo "Tracked private key detected" >&2
            exit 1
          fi
      - name: Check Python and frontend secrets are not hard-coded
        run: |
          if grep -RInE 'service_role.{0,8}=.{0,8}[A-Za-z0-9._-]{30,}' backend/app frontend/src --include='*.py' --include='*.ts' --include='*.tsx'; then
            echo "Possible hard-coded service role credential" >&2
            exit 1
          fi
          exit 0
